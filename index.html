<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock - Aiia</title>
    <link rel="stylesheet" href="src/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🌍 World Clock</h1>
      </header>
      <main>
        <div class="city-selector">
          <select>
            <option>Select a city...</option>
            <option>Kyiv</option>
            <option>New York</option>
            <option>London</option>
            <option>Tokyo</option>
          </select>
        </div>

        <section class="cities">
          <div class="city">
            <div class="city-info">
              <h2>Kyiv</h2>
              <p class="date">June 10, 2026</p>
            </div>
            <div class="time">
              14:35
              <small>24h</small>
            </div>
          </div>

          <div class="city">
            <div class="city-info">
              <h2>New York</h2>
              <p class="date">June 10, 2026</p>
            </div>
            <div class="time">
              07:35
              <small>AM</small>
            </div>
          </div>

          <div class="city">
            <div class="city-info">
              <h2>Tokyo</h2>
              <p class="date">June 10, 2026</p>
            </div>
            <div class="time">
              20:35
              <small>PM</small>
            </div>
          </div>
        </section>
      </main>

      <footer>
        This project was coded by
        <a
          href="https://www.linkedin.com/in/aiia-melnychenko-09b52a275/"
          target="_blank"
        >
          Melnychenko Aiia</a
        >
        and is
        <a href="https://github.com/MelAiia/WorldClock" target="_blank">
          open-sourced on GitHub</a
        >
        and is
        <a href="https://aiiaworldclock.netlify.app/" target="_blank">
          hosted on Netlify</a
        >.
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
